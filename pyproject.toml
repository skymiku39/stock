[project]
name = "stock-bot"
version = "0.1.0"
description = "台股當沖自動交易機器人 (Shioaji)"
readme = "README.md"
authors = [
    { name = "skymiku39", email = "52848246+skymiku39@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "shioaji",
    "pydantic-settings",
    "python-dotenv",
    "pandas",
]

[project.scripts]
stock-bot = "bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]
