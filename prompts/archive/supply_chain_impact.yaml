id: supply_chain_impact
version: "1.0"
description: 分析單一美股新聞/財報，輸出對台股供應鏈的具體影響 JSON
model_hint: gemini-2.5-flash
max_output_tokens: 1500
temperature: 0.2
inputs:
  - name: us_ticker
    required: true
  - name: us_name
    required: false
  - name: news_text
    required: true
    max_chars: 30000
  - name: candidate_tw_stocks_json
    required: true
    desc: 該美股對應的台股供應鏈 JSON (供 LLM 推理時收斂範圍)
output_format: json
template: |
  你是一位專注「美台供應鏈傳導」的賣方分析師。請依據以下美股
  「{us_ticker} {us_name}」的新聞 / 財報內容，評估對台股供應鏈的具體影響。

  輸出**合法 JSON** (無 markdown)，schema：
  {{
    "summary": "100 字內中文摘要新聞核心訊息",
    "overall_sentiment": "positive | neutral | negative",
    "magnitude": "high | medium | low",
    "horizon": "short | medium | long",
    "impacts": [
      {{
        "tw_ticker": "對應台股代號",
        "tw_name": "台股名稱",
        "role": "在供應鏈中的角色",
        "impact": "positive | neutral | negative",
        "impact_score": -1.0 到 1.0 浮點數,
        "reason": "中文 50 字內具體理由"
      }}
    ],
    "key_quotes": ["1-3 段原文重點，可中英文混排"],
    "watch_indicators": ["1-3 個值得後續追蹤的指標 (例如：H100 訂單能見度、CoWoS 擴產時程)"]
  }}

  注意：
  - 只能從 candidate_tw_stocks_json 中挑出有具體傳導關係的台股
  - 沒影響的台股請略過
  - 若新聞含 capex、毛利率、產能、客戶集中度等關鍵字，要在 reason 中標明
  - impact_score 與 overall_sentiment 必須方向一致

  ## 候選台股供應鏈
  ```json
  {candidate_tw_stocks_json}
  ```

  ## 新聞 / 財報內容
  """
  {news_text}
  """
