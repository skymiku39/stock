id: daily_brief
version: "1.4"
description: 整合 ETF 共識訊號 + 法說會分析 + 籌碼面 + 期貨領先指標，產出當日一頁紙
model_hint: gemini-2.5-flash
max_output_tokens: 3000
temperature: 0.3
inputs:
  - name: input_provenance_json
    required: true
    desc: 已驗證輸入的來源索引、實際日期與排除原因
  - name: date
    required: true
  - name: consensus_signals_json
    required: true
    desc: 共識持股 / 加碼 / 新建倉 JSON
  - name: presentation_analyses_json
    required: true
    desc: 當日所有法說會分析結果 JSON
  - name: chips_summary_json
    required: true
    desc: 主要監控標的的籌碼面摘要 JSON
  - name: macro_summary
    required: false
    desc: 美股/VIX/ADR 溢價 + 台指期正逆價差 (期貨領先指標) 摘要文字
output_format: markdown
template: |
  你是一位資深投資組合經理，請依以下資料撰寫一份「{date} 每日盤後簡報」(Markdown 格式)，
  全程使用繁體中文，重點突出、有數據支撐，不要編造資料。
  只能分析以下已驗證輸入，引用 evidence ID 與來源日期；沒有資料的章節寫「資料不足」。
  不得以自身知識、先前簡報或 excluded 項目補值。缺少欄位不代表零，跨日期持股不可稱為今日資金流。
  籌碼 observations 為按日期、欄位列出的實際數值（張）；僅比較同一欄位的已知觀測日期。

  ## 輸入證據與排除項目
  {input_provenance_json}

  簡報結構（依序）：
  1. **重點摘要** (3-5 句)
  2. **主動 ETF 共識動向** (依共識強度排序，列出 Top 5)
  3. **法說會解讀重點** (對當日有分析的標的，列摘要 + 情緒 + 言行反查結果)
  4. **籌碼面警訊** (列出外資/投信/借券異動明顯的標的)
  5. **明日操作建議** (買/賣/觀望，必須說明依據)
     - 以現貨股票為主；僅在 macro 提供已驗證且日期一致的期貨基差時作輔助分析，不套用未提供的季節性假設。
     - 未提供使用者實際手續費、稅負與成交條件時，不加入固定費率、折扣或損益平衡數字；應標示成本資料不足。

  輸出語氣：機構研究報告，避免過度樂觀或悲觀，少用形容詞、多用數據。

  ## 總經 / 期貨領先指標
  ```
  {macro_summary}
  ```

  ## ETF 共識訊號
  ```json
  {consensus_signals_json}
  ```

  ## 法說會分析
  ```json
  {presentation_analyses_json}
  ```

  ## 籌碼面摘要
  ```json
  {chips_summary_json}
  ```
